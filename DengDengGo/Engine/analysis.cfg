# KataGo 分析引擎在 App 里的配置。键的含义见 KataGo 源码 cpp/configs/analysis_example.cfg。

# 日志只打到 Xcode 控制台，App 包里不能写文件。
logToStderr = true
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# 胜率、目数、归属都从轮到下的一方来看，和 GoCore.EngineAnalysis 的约定一致。
reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 10

# 判题时"下这一手之前"和"下这一手之后"两个局面一起算，再加上提前算的下一个局面。
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
numNNServerThreadsPerModel = 1

# 判题要的是最好的下法，不要为了多样性随机探索。
wideRootNoise = 0.0
